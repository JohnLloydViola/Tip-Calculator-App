<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main</title>
  <link rel="icon" href="images/favicon-32x32.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>SPLI <br> TTER</h1>

  <main>
    <div class="bill-container">
      <div class="bill">
        <label for="bill-input">Bill</label>
        <div>
        <input type="text" id="bill-input" placeholder="0">
        <img src="images/icon-dollar.svg" alt="dollar icon">
        </div>
      </div>

      <div class="tip">
        <p>Select Tip %</p>
        <div class="tip-percentage">
          <button> 5%</button>
          <button> 10%</button>
          <button> 15%</button>
          <button> 25%</button>
          <button> 50%</button>
          <input type="text" id="custom-btn" placeholder="Custom"></input>
          
        </div>
      </div>

      <div class="number-people">
        <label for="">Number of People</label>
        <div>
           <input type="text" id="people-input" placeholder="0">
           <img src="images/icon-person.svg" alt="person-icon">
        </div>
       
      </div>

    </div>


    <div class="result-container">
      <div class="tip-amount">
        <div>
          <p>Tip Amount</p>
          <p class="person">/ person</p>
        </div>
        <div>
          <p class="tip-value">&dollar;0.00</p>
        </div>
      </div>

      <div class="total-amount">
         <div>
          <p>Total</p>
          <p class="person">/ person</p>
        </div>
        <div>
          <p class="total-value">&dollar;0.00</p>
        </div>
      </div>

      <button class="reset-Btn">RESET</button>

    </div>
    
  </main>
  
  <script src="script.js"></script>
</body>
</html>
