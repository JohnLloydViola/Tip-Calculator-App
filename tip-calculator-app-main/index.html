<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main</title>
  <link rel="icon" href="images/favicon-32x32.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>SPLI <br> TTER</h1>

  <main>
    <div class="bill-container">
      <div class="bill">
        <div>
           <label for="bill-input">Bill</label>
            <p id="bill-error-msg"></p>
        </div>
       
        <div>
        <input type="text" id="bill-input" placeholder="0">
        <img src="images/icon-dollar.svg" alt="dollar icon">
        </div>
      </div>

      <div class="tip">
        <p>Select Tip %</p>
        <div class="tip-percentage">
          <button class= "btnVal" data-percentage-value="5"> 5%</button>
          <button class= "btnVal" data-percentage-value="10"> 10%</button>
          <button class= "btnVal" data-percentage-value="15"> 15%</button>
          <button class= "btnVal" data-percentage-value="25"> 25%</button>
          <button class= "btnVal" data-percentage-value="50"> 50%</button>
          <div>
            <input type="text" id="custom-btn" placeholder="Custom" maxlength="3">
            <p id="custom-error-msg"></p>
          </div>
        </div>
      </div>

      <div class="number-people">

        <div>
           <label>Number of People</label>
           <p id="number-error-msg"></p>

        </div>
       
        <div>
           <input type="text" id="people-input" placeholder="0">
           <img src="images/icon-person.svg" alt="person-icon">
        </div>
       
      </div>

    </div>


    <div class="result-container">
      <div class="tip-amount">
        <div>
          <p>Tip Amount</p>
          <p class="person">/ person</p>
        </div>
        <div>
          <p id="tip-value">&#36;0.00</p>
        </div>
      </div>

      <div class="total-amount">
         <div>
          <p>Total</p>
          <p class="person">/ person</p>
        </div>
        <div>
          <p id="total-value">&#36;0.00</p>
        </div>
      </div>

      <button class="reset-btn">RESET</button>

    </div>
    
  </main>
  
  <script src="script.js">
    

  </script>
</body>
</html>
